name: Story 76.5 teardown-verify temp verification workflow

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy-teardown-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dummy deploy step -- real disposable Azure Container Instance (Story 76.3)
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ACI_PULL_IDENTITY_ID: ${{ vars.AZURE_ACI_PULL_IDENTITY_ID }}
        run: |
          python3 - <<'PYEOF'
          """Story 76.3. Inline, stdlib-only extension of the dummy-deploy step: mint a
          SECOND, separately-audienced GitHub OIDC token (api://AzureADTokenExchange, the
          fixed audience Azure AD federated-credential exchange requires -- distinct from
          the preflight step's own CAP16_PREFLIGHT_OIDC_AUDIENCE token above), exchange it
          for an Azure CLI session via `az login --service-principal --federated-token`
          (no client secret, ever), build/push the test agent's image to the epic's own
          ACR, and create one disposable, uniquely-suffixed Azure Container Instance
          running it. Continues Story 76.2's zero-`uses:` design (Dev Notes "Why raw-fetch,
          not actions/checkout") -- `main.py`/`Dockerfile` are fetched by plain HTTPS GET
          from raw.githubusercontent.com at this run's own commit SHA, never checked out
          via a third-party Action.

          `az`/`docker` are both preinstalled on the `ubuntu-latest` runner image; this
          script shells out to them via subprocess rather than reimplementing the Azure
          REST API or the OCI registry push protocol in stdlib Python -- unlike the OIDC
          mint and raw-fetch HTTP calls, which stay urllib-only per the preflight step's
          own H1 (never follow a redirect) precedent.

          Pull-side identity is a pre-created USER-assigned managed identity
          (AZURE_ACI_PULL_IDENTITY_ID), not the system-assigned '[system]' shortcut the
          story's own Dev Notes originally described. Found live during this story's own
          verification run: `az container create --assign-identity '[system]'
          --acr-identity '[system]'` in a single call hits a real, documented az-cli/ARM
          ordering limitation -- the container group's system-assigned identity does not
          exist yet at the point the CLI tries to resolve `--acr-identity`, so it 404s
          looking up a resource literally named "[system]" under
          Microsoft.ManagedIdentity/userAssignedIdentities. A pre-created, pre-authorized
          (AcrPull granted ahead of time by the durable local session, same as the
          workflow's own AcrPush/ACI-Contributor grants) user-assigned identity sidesteps
          the ordering problem entirely -- the identity already exists when this call
          resolves it -- while preserving the exact same property AC1/Dev Notes "No ACR
          admin credentials" required: no stored/long-lived credential, only a managed
          identity attached at create time.

          `--os-type Linux` is likewise explicit rather than left to its documented default:
          found live in the same run, `az container create --acr-identity <id>` (any identity
          shape) omits `osType` from its generated ARM payload unless `--os-type` is passed
          explicitly, producing a server-side `InvalidOsType` 400 with no client-side warning.

          `--ip-address Public` is also explicit: found live, the first successful create (no
          error, container reached Running) left `ipAddress` entirely null -- `az container
          create` does not default to a public IP merely because `--ports` was given, and
          Task 5.3's own "actually works" HTTP check needs a reachable address.
          """
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          AZURE_OIDC_AUDIENCE = "api://AzureADTokenExchange"


          class DeployFailed(Exception):
              """Any failure mode this script exits nonzero for."""


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              """Same H1 precedent as the preflight step above: refuse a redirect outright
              rather than silently following it -- both the OIDC OpenID `Bearer` token and
              the raw-fetched file contents are sensitive/integrity-relevant enough that a
              redirect target must never receive them."""

              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise DeployFailed(f"refusing to follow a redirect to {newurl!r}")


          _OPENER = urllib.request.build_opener(_NoRedirect)


          def env(name):
              value = os.environ.get(name)
              if not value:
                  raise DeployFailed(f"required environment variable {name} is not set")
              return value


          def mint_oidc_token(audience):
              request_url = env("ACTIONS_ID_TOKEN_REQUEST_URL")
              request_token = env("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
              sep = "&" if "?" in request_url else "?"
              url = f"{request_url}{sep}audience={urllib.parse.quote(audience)}"
              req = urllib.request.Request(
                  url, headers={"Authorization": f"Bearer {request_token}"}
              )
              with _OPENER.open(req, timeout=15.0) as resp:  # noqa: S310
                  body = json.loads(resp.read())
              token = body.get("value")
              if not token:
                  raise DeployFailed("OIDC token minting response carried no 'value' field")
              return str(token)


          def fetch_raw(repo, sha, path):
              url = f"https://raw.githubusercontent.com/{repo}/{sha}/{path}"
              req = urllib.request.Request(url)  # noqa: S310
              try:
                  with _OPENER.open(req, timeout=15.0) as resp:  # noqa: S310
                      return resp.read()
              except urllib.error.HTTPError as exc:
                  raise DeployFailed(f"failed to fetch {url}: HTTP {exc.code}")


          def container_group_name(run_id, run_attempt):
              # 1f fix (LOW-1): run_id ALONE repeats verbatim across a job re-run (a re-run
              # reuses the same GITHUB_RUN_ID) -- fold in run_attempt too, same as the
              # preflight step's own operation_id, so a re-run never collides.
              return f"epic46-test-agent-{run_id}-{run_attempt}"


          def image_tag(acr_name, run_id, run_attempt):
              return f"{acr_name}.azurecr.io/praitor-test-agent-epic46:{run_id}-{run_attempt}"


          def run(cmd, secrets=(), quiet=False):
              # 1f fix (LOW-2/S3): redact any argv element named in `secrets` (e.g. the live
              # OIDC-exchanged bearer token) from the echoed command line -- `::add-mask::`
              # already protects it, but the value should never be *printed* at all, not
              # rely on a single masking mechanism in a public repo's run log.
              echoed = ["***" if part in secrets else part for part in cmd]
              printable = "+ " + " ".join(echoed)
              print(printable)
              try:
                  subprocess.run(  # noqa: S603
                      cmd,
                      check=True,
                      stdout=subprocess.DEVNULL if quiet else None,
                  )
              except subprocess.CalledProcessError as exc:
                  # 1f fix (LOW-2/S3): raise with the REDACTED command, never exc.cmd
                  # verbatim -- exc.cmd carries the real secret value.
                  raise DeployFailed(
                      f"command exited {exc.returncode}: {printable}"
                  ) from exc


          def main():
              try:
                  client_id = env("AZURE_CLIENT_ID")
                  tenant_id = env("AZURE_TENANT_ID")
                  subscription_id = env("AZURE_SUBSCRIPTION_ID")
                  acr_name = env("AZURE_ACR_NAME")
                  resource_group = env("AZURE_RESOURCE_GROUP")
                  pull_identity_id = env("AZURE_ACI_PULL_IDENTITY_ID")
                  repo = env("GITHUB_REPOSITORY")
                  sha = env("GITHUB_SHA")
                  run_id = env("GITHUB_RUN_ID")
                  run_attempt = env("GITHUB_RUN_ATTEMPT")

                  token = mint_oidc_token(AZURE_OIDC_AUDIENCE)
                  print("::add-mask::" + token)

                  run(
                      [
                          "az",
                          "login",
                          "--service-principal",
                          "-u",
                          client_id,
                          "-t",
                          tenant_id,
                          "--federated-token",
                          token,
                      ],
                      secrets=(token,),
                      # 1f fix (S2): az login's own JSON response enumerates every
                      # subscription/tenant this SP can see -- not needed downstream.
                      quiet=True,
                  )
                  run(
                      ["az", "account", "set", "--subscription", subscription_id],
                      quiet=True,
                  )

                  workdir = "epic46-deploy-build"
                  os.makedirs(workdir, exist_ok=True)
                  for name in ("main.py", "Dockerfile"):
                      content = fetch_raw(repo, sha, name)
                      with open(os.path.join(workdir, name), "wb") as fh:
                          fh.write(content)

                  tag = image_tag(acr_name, run_id, run_attempt)
                  run(["docker", "build", "-t", tag, workdir])
                  run(["az", "acr", "login", "--name", acr_name], quiet=True)
                  run(["docker", "push", tag])

                  group_name = container_group_name(run_id, run_attempt)
                  run(
                      [
                          "az",
                          "container",
                          "create",
                          "--resource-group",
                          resource_group,
                          "--name",
                          group_name,
                          "--image",
                          tag,
                          "--cpu",
                          "1",
                          "--memory",
                          "1",
                          "--ports",
                          "8080",
                          "--os-type",
                          "Linux",
                          "--ip-address",
                          "Public",
                          "--restart-policy",
                          "Never",
                          "--assign-identity",
                          pull_identity_id,
                          "--acr-identity",
                          pull_identity_id,
                          "--tags",
                          "environment=non-production",
                          "purpose=epic76-disposable-test-agent",
                          "epic=76",
                          f"run_id={run_id}",
                      ],
                      # 1f fix (S2): the create response's ARM object dumps subscription
                      # id, tenant id, managed-identity client/principal ids, ACR login
                      # server, and the public IP into this PUBLIC repo's run log; none
                      # of it is needed downstream (the group name is already known).
                      quiet=True,
                  )

                  print(
                      f"deploy: created container group {group_name!r} "
                      f"from image {tag!r} in {resource_group!r}"
                  )
                  return 0
              except DeployFailed as exc:
                  # 1f fix (LOW-2/S3): run() now converts every CalledProcessError into a
                  # DeployFailed carrying the REDACTED command line -- a dedicated
                  # `except subprocess.CalledProcessError` branch here would echo
                  # exc.cmd verbatim (the real token), so it's removed rather than kept
                  # as unreachable dead code that traps a future direct subprocess.run().
                  print(f"deploy: FAILED -- {exc}", file=sys.stderr)
                  return 1
              except Exception as exc:  # noqa: BLE001 - fail closed on ANY unexpected error
                  print(f"deploy: FAILED -- unexpected error: {exc}", file=sys.stderr)
                  return 1


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
      - name: Teardown disposable Container Instance (Story 76.5)
        if: always()
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          python3 - <<'PYEOF'
          """Story 76.5. Inline, stdlib-only teardown step: mints its OWN fresh OIDC
          token/az-login session (never reuses the deploy step's -- Dev Notes "Why
          re-login instead of reusing the deploy step's session"), so it runs correctly
          whether the deploy step above it ran at all (`if: always()` -- the preflight
          step above may have exited nonzero and skipped it entirely).

          Duplicates (never imports) the deploy step's own mint_oidc_token/env/run/
          _NoRedirect/container_group_name() -- Dev Notes "Duplicated helpers, not
          shared -- and why that's an accepted risk" explains why, and flags
          container_group_name()'s formula as the one thing that must stay byte-
          identical across all three copies (deploy, teardown, verify).

          Real deviation found live during this story's own Task 3.5 probe (recorded in
          Dev Agent Record): `az container delete --yes` on a container group name that
          was never created returns HTTP 204 / exit 0 -- ARM DELETE is idempotent, there
          is no separate "ResourceNotFound" failure mode to catch here (that shape
          belongs to a GET, e.g. the verify step's own `az container show` below, not to
          DELETE). So this step does not need to distinguish "already absent" from
          "just deleted" -- a single delete call, treated as fail-closed on any nonzero
          exit, correctly satisfies AC1 either way.
          """
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          AZURE_OIDC_AUDIENCE = "api://AzureADTokenExchange"


          class TeardownFailed(Exception):
              """Any failure mode this step exits nonzero for."""


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise TeardownFailed(f"refusing to follow a redirect to {newurl!r}")


          _OPENER = urllib.request.build_opener(_NoRedirect)


          def env(name):
              value = os.environ.get(name)
              if not value:
                  raise TeardownFailed(f"required environment variable {name} is not set")
              return value


          def mint_oidc_token(audience):
              request_url = env("ACTIONS_ID_TOKEN_REQUEST_URL")
              request_token = env("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
              sep = "&" if "?" in request_url else "?"
              url = f"{request_url}{sep}audience={urllib.parse.quote(audience)}"
              req = urllib.request.Request(
                  url, headers={"Authorization": f"Bearer {request_token}"}
              )
              with _OPENER.open(req, timeout=15.0) as resp:  # noqa: S310
                  body = json.loads(resp.read())
              token = body.get("value")
              if not token:
                  raise TeardownFailed("OIDC token minting response carried no 'value' field")
              return str(token)


          def container_group_name(run_id, run_attempt):
              # MUST stay byte-identical to the deploy step's and verify step's own copy.
              return f"epic46-test-agent-{run_id}-{run_attempt}"


          def run(cmd, secrets=(), quiet=False):
              echoed = ["***" if part in secrets else part for part in cmd]
              printable = "+ " + " ".join(echoed)
              print(printable)
              try:
                  subprocess.run(  # noqa: S603
                      cmd,
                      check=True,
                      stdout=subprocess.DEVNULL if quiet else None,
                  )
              except subprocess.CalledProcessError as exc:
                  raise TeardownFailed(
                      f"command exited {exc.returncode}: {printable}"
                  ) from exc


          def main():
              try:
                  client_id = env("AZURE_CLIENT_ID")
                  tenant_id = env("AZURE_TENANT_ID")
                  subscription_id = env("AZURE_SUBSCRIPTION_ID")
                  resource_group = env("AZURE_RESOURCE_GROUP")
                  run_id = env("GITHUB_RUN_ID")
                  run_attempt = env("GITHUB_RUN_ATTEMPT")

                  token = mint_oidc_token(AZURE_OIDC_AUDIENCE)
                  print("::add-mask::" + token)

                  run(
                      [
                          "az",
                          "login",
                          "--service-principal",
                          "-u",
                          client_id,
                          "-t",
                          tenant_id,
                          "--federated-token",
                          token,
                      ],
                      secrets=(token,),
                      quiet=True,
                  )
                  run(
                      ["az", "account", "set", "--subscription", subscription_id],
                      quiet=True,
                  )

                  group_name = container_group_name(run_id, run_attempt)
                  run(
                      [
                          "az",
                          "container",
                          "delete",
                          "--resource-group",
                          resource_group,
                          "--name",
                          group_name,
                          "--yes",
                      ],
                      quiet=True,
                  )

                  print(
                      "teardown: delete request completed for container group "
                      f"{group_name!r} in {resource_group!r} (idempotent -- absent-or-"
                      "present both succeed at HTTP 204/exit 0)"
                  )
                  return 0
              except TeardownFailed as exc:
                  print(f"teardown: FAILED -- {exc}", file=sys.stderr)
                  return 1
              except Exception as exc:  # noqa: BLE001 - fail closed on ANY unexpected error
                  print(f"teardown: FAILED -- unexpected error: {exc}", file=sys.stderr)
                  return 1


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
      - name: Verify teardown independently (Story 76.5)
        if: always()
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          python3 - <<'PYEOF'
          """Story 76.5. Independent verification step -- AC2's own evidence artifact.
          Mints its OWN fresh OIDC token / az-login session (never reuses the teardown
          step's -- Dev Notes "Why re-login instead of reusing the deploy step's
          session" applies identically here), and runs even if the teardown step above
          somehow failed (`if: always()`), so a failed teardown is independently
          observed rather than silently skipped.

          Two checks, both via `az container` (never `az resource list` -- Dev Notes
          "Why `az container list`, not `az resource list`"):
            (a) SPECIFIC: `az container show` for this run's own group name. Verified
                live (Task 3.5/4.3 probe, recorded in Dev Agent Record): a GET on an
                absent container group exits nonzero with a message containing
                "ResourceNotFound" -- that IS the expected/CLEAN outcome here (unlike
                the teardown step's own idempotent DELETE, which never surfaces this).
            (b) GENERAL: `az container list` for the whole resource group, expect `[]`.

          Evidence (both raw outputs) is written to $GITHUB_STEP_SUMMARY -- a native
          runner feature needing no `uses:` entry -- per Dev Notes "Why
          $GITHUB_STEP_SUMMARY, not an uploaded artifact".
          """
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          AZURE_OIDC_AUDIENCE = "api://AzureADTokenExchange"


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError(f"refusing to follow a redirect to {newurl!r}")


          _OPENER = urllib.request.build_opener(_NoRedirect)


          def env(name):
              value = os.environ.get(name)
              if not value:
                  raise RuntimeError(f"required environment variable {name} is not set")
              return value


          def mint_oidc_token(audience):
              request_url = env("ACTIONS_ID_TOKEN_REQUEST_URL")
              request_token = env("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
              sep = "&" if "?" in request_url else "?"
              url = f"{request_url}{sep}audience={urllib.parse.quote(audience)}"
              req = urllib.request.Request(
                  url, headers={"Authorization": f"Bearer {request_token}"}
              )
              with _OPENER.open(req, timeout=15.0) as resp:  # noqa: S310
                  body = json.loads(resp.read())
              token = body.get("value")
              if not token:
                  raise RuntimeError("OIDC token minting response carried no 'value' field")
              return str(token)


          def container_group_name(run_id, run_attempt):
              # MUST stay byte-identical to the deploy step's and teardown step's own copy.
              return f"epic46-test-agent-{run_id}-{run_attempt}"


          def run_quiet(cmd, secrets=()):
              echoed = ["***" if part in secrets else part for part in cmd]
              print("+ " + " ".join(echoed))
              subprocess.run(cmd, check=True, stdout=subprocess.DEVNULL)  # noqa: S603


          def run_capture(cmd):
              """Never raises on a nonzero exit -- the caller interprets exit code and
              output itself, since a nonzero exit (ResourceNotFound) is the expected,
              CLEAN outcome for the `container show` check."""
              print("+ " + " ".join(cmd))
              return subprocess.run(  # noqa: S603
                  cmd, capture_output=True, text=True
              )


          def write_summary(text):
              path = env("GITHUB_STEP_SUMMARY")
              with open(path, "a", encoding="utf-8") as fh:
                  fh.write(text)


          def main():
              try:
                  client_id = env("AZURE_CLIENT_ID")
                  tenant_id = env("AZURE_TENANT_ID")
                  subscription_id = env("AZURE_SUBSCRIPTION_ID")
                  resource_group = env("AZURE_RESOURCE_GROUP")
                  run_id = env("GITHUB_RUN_ID")
                  run_attempt = env("GITHUB_RUN_ATTEMPT")
                  group_name = container_group_name(run_id, run_attempt)

                  token = mint_oidc_token(AZURE_OIDC_AUDIENCE)
                  print("::add-mask::" + token)

                  run_quiet(
                      [
                          "az",
                          "login",
                          "--service-principal",
                          "-u",
                          client_id,
                          "-t",
                          tenant_id,
                          "--federated-token",
                          token,
                      ],
                      secrets=(token,),
                  )
                  run_quiet(["az", "account", "set", "--subscription", subscription_id])

                  show = run_capture(
                      [
                          "az",
                          "container",
                          "show",
                          "--resource-group",
                          resource_group,
                          "--name",
                          group_name,
                          "-o",
                          "json",
                      ]
                  )
                  show_clean = show.returncode != 0 and "ResourceNotFound" in show.stderr

                  listing = run_capture(
                      [
                          "az",
                          "container",
                          "list",
                          "--resource-group",
                          resource_group,
                          "-o",
                          "json",
                      ]
                  )
                  try:
                      remaining = json.loads(listing.stdout) if listing.returncode == 0 else None
                  except ValueError:
                      remaining = None
                  list_clean = listing.returncode == 0 and remaining == []

                  clean = show_clean and list_clean

                  summary_lines = [
                      "## Story 76.5 -- independent teardown verification\n",
                      f"- run: `{run_id}-{run_attempt}`\n",
                      f"- resource group: `{resource_group}`\n",
                      f"- expected container group: `{group_name}`\n",
                      f"- result: **{'CLEAN' if clean else 'DIRTY'}**\n",
                      "\n### `az container show` (specific check)\n",
                      f"exit code: `{show.returncode}`\n\n",
                      "```\n" + (show.stderr or show.stdout or "<no output>") + "\n```\n",
                      "\n### `az container list` (general check)\n",
                      f"exit code: `{listing.returncode}`\n\n",
                      "```\n" + (listing.stdout or listing.stderr or "<no output>") + "\n```\n",
                  ]
                  write_summary("".join(summary_lines))

                  if clean:
                      print(
                          "teardown-verify: CLEAN (no resources for run "
                          f"{run_id}-{run_attempt} in {resource_group})"
                      )
                      return 0

                  details = []
                  if not show_clean:
                      details.append(
                          f"container show for {group_name!r} did not confirm absence "
                          f"(exit {show.returncode}): {show.stdout or show.stderr}"
                      )
                  if not list_clean:
                      details.append(
                          f"container list is not empty (exit {listing.returncode}): "
                          f"{remaining if remaining is not None else listing.stdout or listing.stderr}"
                      )
                  print(
                      "teardown-verify: DIRTY -- " + "; ".join(details),
                      file=sys.stderr,
                  )
                  return 1
              except Exception as exc:  # noqa: BLE001 - fail closed on ANY unexpected error
                  print(f"teardown-verify: FAILED -- unexpected error: {exc}", file=sys.stderr)
                  return 1


          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
